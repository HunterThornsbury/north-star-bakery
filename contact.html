<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery | Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Contact North Star Bakery</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Visit Us</h2>
            <p>North Star Bakery</p>
            <p>123 North Star Avenue</p>
            <p>Monday-Friday: 7:00 AM-6:00 PM</p>
            <p>Saturday: 8:00 AM-4:00 PM</p>
            <p>Sunday: Closed</p>
        </section>

        <section>
            <h2>Contact and Pre-Order Form</h2>

            <form action="#" method="post">
                <fieldset>
                    <legend>Customer Information</legend>

                    <p>
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" name="name" required>
                    </p>

                    <p>
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Inquiry or Pre-Order</legend>

                    <p>
                        <label for="request-type">Request Type:</label>
                        <select id="request-type" name="request-type" required>
                            <option value="">Select an option</option>
                            <option value="general">General Inquiry</option>
                            <option value="bread">Bread Pre-Order</option>
                            <option value="pastry">Pastry Pre-Order</option>
                            <option value="cake">Cake Pre-Order</option>
                        </select>
                    </p>

                    <p>
                        <label for="pickup-date">Preferred Pickup Date:</label>
                        <input
                            type="date"
                            id="pickup-date"
                            name="pickup-date"
                        >
                    </p>

                    <p>
                        <label for="message">Message or Order Details:</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required
                        ></textarea>
                    </p>
                </fieldset>

                <button type="submit">Submit Request</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 North Star Bakery</p>
    </footer>
    
<script src="script.js"></script>
</body>
</html>
